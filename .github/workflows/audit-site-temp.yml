name: 🔍 Audit technique temporaire Ma_JesTik (sans modification du site)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-site-temp.yml
permissions:
  contents: read
jobs:
  verification-publique:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer navigateur de contrôle
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install chromium --with-deps
      - name: Vérifier les pages publiées depuis un navigateur neuf
        run: node scripts/audit-site-temp.cjs
      - name: Tester interactions visiteur, FAQ, jeux, contact et APIs publiques
        run: node scripts/audit-interactions-temp.cjs
      - name: Garder rapport et captures (aucun compte connecté)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-jestik-audit-public
          path: site-audit/
          retention-days: 3
          if-no-files-found: warn

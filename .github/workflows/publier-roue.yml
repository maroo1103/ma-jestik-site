name: Déployer le site Ma_JesTik

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Préparer les vraies cartes et captures Warzone
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          python scripts/deploy-warzone-assets.py
          python scripts/deploy-future-warzone-assets.py

      - name: Verifier le site original
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/qg/index.html
          test -f dist/qg/qg.js
          test -f dist/qg/twitch-auth.js
          test -f dist/qg/tribunal.js
          test -f dist/style.css
          test -f dist/app.js
          test -f dist/engine.mjs
          test -f dist/image-storage.mjs
          test -f dist/wheel-library.mjs
          test -f dist/wheel-multijeux.css
          node --check dist/app.js
          node --check dist/wheel-library.mjs
          node --check dist/warzone-hajin.mjs
          node --check dist/warzone-zodiac.mjs
          node --check dist/warzone-rebirth.mjs
          node --check dist/warzone-verdansk.mjs
          node --check dist/map.js
          for n in $(seq -w 1 12); do
            test -f "dist/assets/${n}.webp"
          done

      - name: Generer les miniatures Open Graph
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "CairoSVG>=2.7,<3" "Pillow>=10,<13"
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          social = Path('dist/og')
          expected = {'qg', 'roue', 'defis', 'killathon', 'tribunal', 'classement', 'setup', 'partenaires', 'createur'}
          found = {p.stem for p in social.glob('*.svg')}
          if found != expected:
              raise SystemExit(f'Miniatures manquantes ou inattendues : {expected ^ found}')
          # Les créations validées sont déposées dans dist/og/premium/.
          # En l'absence d'un visuel final, conserver l'ancien SVG : aucun
          # lien d'image cassé pendant l'import progressif.
          premium_dir = social / 'premium'
          for artwork in sorted(social.glob('*.svg')):
              destination = artwork.with_suffix('.png')
              premium = premium_dir / (artwork.stem + '.png')
              if premium.is_file():
                  with Image.open(premium) as source:
                      source.load()
                      if source.size != (1200, 630):
                          raise SystemExit(f'Visuel premium mal dimensionne : {premium} ({source.size})')
                      source.convert('RGB').save(destination, format='PNG', optimize=True)
                  origin = 'premium'
              else:
                  cairosvg.svg2png(url=str(artwork), write_to=str(destination), output_width=1200, output_height=630)
                  origin = 'svg de secours'
              with Image.open(destination) as result:
                  if result.size != (1200, 630):
                      raise SystemExit(f'Format incorrect pour {destination}')
                  # Les cartes du QG utilisent la version WebP légère.
                  result.convert('RGB').save(
                      artwork.with_suffix('.webp'), format='WEBP', quality=94, method=6
                  )
              print(f'Miniature creee : {destination} ({origin}, {destination.stat().st_size} octets)')
          PY

      - name: Generer les icones installables MJ
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('dist/icons/mj-source.webp')
          if not source.is_file():
              raise SystemExit('Logo MJ manquant')
          with Image.open(source) as raw:
              raw.load()
              if raw.size != (192, 192):
                  raise SystemExit('Format source MJ incorrect')
              logo = raw.convert('RGBA')

          folder = Path('dist/icons')
          folder.mkdir(exist_ok=True)
          for size in (16, 32, 48, 180, 192, 512):
              destination = folder / f'icon-{size}.png'
              logo.resize((size, size), Image.Resampling.LANCZOS).save(destination, 'PNG', optimize=True)

          # Android masque parfois les angles : le logo reste entièrement dans sa zone sûre.
          maskable = Image.new('RGBA', (512, 512), (7, 23, 37, 255))
          inner = logo.resize((384, 384), Image.Resampling.LANCZOS)
          maskable.alpha_composite(inner, (64, 64))
          maskable.save(folder / 'icon-512-maskable.png', 'PNG', optimize=True)

          logo.resize((180, 180), Image.Resampling.LANCZOS).save('dist/apple-touch-icon.png', 'PNG', optimize=True)
          favicon = logo.resize((64, 64), Image.Resampling.LANCZOS)
          favicon.save('dist/favicon.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (64, 64)])
          for name in ('icon-192.png', 'icon-512.png', 'icon-512-maskable.png'):
              with Image.open(folder / name) as im:
                  assert im.size == (int(name.split('-')[1].split('.')[0]),) * 2
          print('Icones application MJ produites : favicon.ico, Apple Touch, PNG 16 a 512 et maskable')
          PY

      - name: Préparer le portrait fidèle du PC Ma_JesTik
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("dist/pc-ma-jestik-nouveau.webp")
          if not source.is_file():
              raise SystemExit("La photo personnelle du PC manque dans dist")
          with Image.open(source) as photo:
              photo = ImageOps.exif_transpose(photo).convert("RGB")
          if photo.size != (1086, 1448):
              raise SystemExit(f"Dimensions inattendues pour la photo : {photo.size}")
          # Le haut du boîtier est penché de ~1.5°. Corriger dans le fichier
          # plutôt que par une rotation CSS qui déforme le cadrage sur le site.
          straight = photo.rotate(
              1.55,
              resample=Image.Resampling.BICUBIC,
              expand=False,
              fillcolor=(8, 17, 30),
          )
          # Réduire uniquement le mur au-dessus et la table en dessous.
          # Les quatre bords du boîtier et les ventilateurs sont conservés.
          framed = straight.crop((18, 110, 1068, 1230))
          destination = Path("dist/qg/media/pc-ma-jestik-cadre.webp")
          destination.parent.mkdir(parents=True, exist_ok=True)
          framed.save(destination, "WEBP", quality=94, method=6)
          with Image.open(destination) as verify:
              assert verify.size == (1050, 1120)
              assert destination.stat().st_size > 90000
          print(f"Photo personnelle du PC redressée : {framed.size}, {destination.stat().st_size} octets")
          PY

      - name: Optimiser les visuels du setup et exclure les archives inutilisées
        shell: bash
        run: python scripts/prepare-deployment.py dist

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4

name: Vérification finale (ponctuelle) du QG après correctifs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-final-temp.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install chromium --with-deps
      - name: Tester site live, images et API en lecture seule
        run: node scripts/smoke-final-temp.cjs
